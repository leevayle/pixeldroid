<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/fonts.css">    
    <link rel="stylesheet" href="styles/global.css">    
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="styles/scrollbar.css">
    <link rel="stylesheet" href="styles/nav.css">
    <link rel="stylesheet" href="styles/footer.css">
    <link rel="stylesheet" href="styles/contact.css">
    <script src="js/index.js" defer></script>
    <script src="js/loading.js" defer></script>
    
    <link rel="icon" href="assets/images/emblem.png" type="image/x-icon">
    <title>Talk to pixeldroid</title>

</head>

<body class="no-margin relative">

    <!-- Initial loader -->
    <!-- To display remove the "display-none" class from this div -->

    <div id="loading" class="flex z1 absolute display-none"> 
        <div class="loading-content self-center">
            <img src="assets/images/loading.gif" alt="Loading..." class="full">
        </div>
    </div>

   


    

    <div class="main">

        <div class="main-gradient flex column">

            <div class="main-top flex  column">

                <div class="progress-outer flex max-width self-center-x">
                    <div class="progress-inner flex" id="progress-bar"></div>
                </div>

                <div class="progress-tiles max-width flex self-center-x ">

                    <div class="progress-tile-parent flex" id="progress-tile-1">

                        <div class="progress-tile-left flex column tc">
                            <div class="progress-count flex square ">
                                1
                            </div>
                            <h1 >Pick a service</h1>
                            <h4>Click on one or more services from <br />the list provided below</h4>

                        </div>
                        <div class="flex progress-tile-right square ">
                            <svg class="full" xmlns="http://www.w3.org/2000/svg" width="800px" height="800px" viewBox="0 0 24 24" fill="none">

                            <g id="SVGRepo_bgCarrier" stroke-width="0"/>

                            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"/>

                            <g id="SVGRepo_iconCarrier"> <path d="M4.89163 13.2687L9.16582 17.5427L18.7085 8" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/> </g>

                            </svg>

                        </div>
                        
                    </div>
                    
                    <div class="progress-tile-parent flex" id="progress-tile-2">

                        <div class="progress-tile-left flex column tc">
                            <div class="progress-count flex square progress-count-incomplete ">
                                2
                            </div>
                            <h1 >Fill your contact</h1>
                            <h4>Provide us the contact that we will reach<br />you later with.</h4>

                        </div>
                        <div class="flex progress-tile-right square progress-tile-right-incomplete">
                            <svg class="full" xmlns="http://www.w3.org/2000/svg" width="800px" height="800px" viewBox="0 0 24 24" fill="none">

                            <g id="SVGRepo_bgCarrier" stroke-width="0"/>

                            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"/>

                            <g id="SVGRepo_iconCarrier"> <g id="Edit / Add_Plus"> <path id="Vector" d="M6 12H12M12 12H18M12 12V18M12 12V6" stroke="#A6A6A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> </g> </g>

                            </svg>

                        </div>
                        
                    </div>
                    
                    <div class="progress-tile-parent flex" id="progress-tile-3">

                        <div class="progress-tile-left flex column tc">
                            <div class="progress-count flex square  progress-count-incomplete">
                                3
                            </div>
                            <h1 >Send to us!</h1>
                            <h4>Complete your request by sending the <br />message to us!</h4>

                        </div>
                        <div class="flex progress-tile-right square progress-tile-right-incomplete">
                            <svg class="full" xmlns="http://www.w3.org/2000/svg" width="800px" height="800px" viewBox="0 0 24 24" fill="none">

                            <g id="SVGRepo_bgCarrier" stroke-width="0"/>

                            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"/>

                            <g id="SVGRepo_iconCarrier"> <g id="Edit / Add_Plus"> <path id="Vector" d="M6 12H12M12 12H18M12 12V18M12 12V6" stroke="#A6A6A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/> </g> </g>

                            </svg>

                        </div>
                        
                    </div>


                </div>

            </div>

            <div class="main-bottom flex">
                <div class="bottom-list-limiter flex self-center-x max-width column">
                    <div class="pick-services-limiter flex ">
                        <div class="pick-service flex">
                            
                        </div>
                        <div class="pick-service flex">

                        </div>
                    </div>
                    <div class="pick-services-limiter flex ">
                        <div class="pick-service flex">
                            
                        </div>
                        <div class="pick-service flex">

                        </div>
                    </div>
                    <div class="pick-services-limiter flex self-center-x" id="message-box">
                        
                        <textarea class="tc" >
    Optional Custom message . . .
                        </textarea>
                    </div>

                </div>

            </div>

        </div>

    </div>
    


   

    
</body>

</html>
